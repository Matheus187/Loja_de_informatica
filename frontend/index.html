<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Loja de Informática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="menu">
  <span class="logo">LOJA DE INFORMÁTICA</span>
  <a onclick="mostrarTela('cadastrar')">Cadastrar venda</a>
  <a onclick="mostrarTela('listar')">Listar as vendas</a>
  <a onclick="mostrarTela('listar')">Categoria mais vendida</a>
  <a onclick="mostrarTela('listar')">Produto mais vendido</a>
</nav>

<!-- CADASTRAR -->
<section id="cadastrar" class="tela active">
  <h2>Cadastrar Venda</h2>

  <label>Cliente ID:</label>
  <input type="number" id="clienteId">

  <label>Vendedor ID:</label>
  <input type="number" id="vendedorId">

  <label>Método de Pagamento:</label>
  <select id="metodoPagamento">
    <option value="pix">Pix</option>
    <option value="cartao">Cartão</option>
    <option value="dinheiro">Dinheiro</option>
  </select>

  <h3>Itens da Venda</h3>

  <label>Produto ID:</label>
  <input type="number" id="produtoId">

  <label>Quantidade:</label>
  <input type="number" id="quantidade">

  <button onclick="adicionarItem()">Adicionar Item</button>

  <ul id="listaItens"></ul>

  <button class="btn-principal" onclick="salvarVenda()">Salvar Venda</button>
</section>

<!-- LISTAR -->
<section id="listar" class="tela">
  <h2>Vendas Cadastradas</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Vendedor</th>
        <th>Pagamento</th>
        <th>Total</th>
          <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabelaVendas"></tbody>
  </table>
</section>

<!-- EDITAR -->
<section id="editar" class="tela">
  <h2>Editar Venda</h2>
  <label>ID da Venda:</label>
  <input type="number" id="editId" readonly>

  <label>Cliente ID:</label>
  <input type="number" id="clienteIdEdit">

  <label>Vendedor ID:</label>
  <input type="number" id="vendedorIdEdit">

  <label>Método de Pagamento:</label>
  <select id="metodoPagamentoEdit">
    <option value="pix">Pix</option>
    <option value="cartao">Cartão</option>
    <option value="dinheiro">Dinheiro</option>
  </select>

  <h3>Itens da Venda (edição)</h3>

  <label>Produto ID:</label>
  <input type="number" id="produtoIdEdit">

  <label>Quantidade:</label>
  <input type="number" id="quantidadeEdit">

  <button onclick="adicionarItemEdicao()">Adicionar Item</button>

  <ul id="listaItensEdit"></ul>

  <button class="btn-principal" onclick="salvarEdicao()">Salvar Alterações</button>
  <button onclick="mostrarTela('listar')">Cancelar</button>
</section>

<script src="vendas.js"></script>
</body>
</html>
